<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom 3D perspective and depth */
        .calculator-body {
            transform: rotateX(10deg) rotateY(-5deg);
            box-shadow: 
                20px 20px 60px rgba(0, 0, 0, 0.3),
                -1px -1px 0px rgba(255, 255, 255, 0.1);
        }
        
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 rgb(30, 41, 59);
        }

        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgb(30, 41, 59);
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #theme-toggle {
            cursor: pointer;
        }

        .dark-mode {
            background-color: #1e293b;
            color: #f1f5f9;
        }
        .light-mode {
            background-color: #f1f5f9;
            color: #1e293b;
        }


    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">
<html lang="en" class="scroll-smooth transition-colors duration-500">

<div class="fixed top-6 right-6 z-[60]">
    <button id="theme-toggle" class="glass p-3 rounded-full hover:scale-110 transition-all text-xl">
        <span id="theme-icon">🌙</span>
    </button>
</div>
    <div class="calculator-body relative bg-slate-800 p-8 rounded-[2rem] border border-slate-700 w-80">
        
        <div class="mb-6 bg-slate-900 p-4 rounded-xl border-t-4 border-black shadow-inner">
            <input type="text" id="display" readonly 
                class="w-full bg-transparent text-right text-3xl text-emerald-400 font-mono focus:outline-none" 
                placeholder="0">
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button onclick="clearDisplay()" class="btn-3d col-span-2 bg-rose-500 hover:bg-rose-400 text-white font-bold py-3 rounded-xl">AC</button>
            <button onclick="deleteLast()" class="btn-3d bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 rounded-xl">DEL</button>
            <button onclick="appendToDisplay('/')" class="btn-3d bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 rounded-xl">/</button>

            <button onclick="appendToDisplay('7')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">7</button>
            <button onclick="appendToDisplay('8')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">8</button>
            <button onclick="appendToDisplay('9')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">9</button>
            <button onclick="appendToDisplay('*')" class="btn-3d bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 rounded-xl">×</button>

            <button onclick="appendToDisplay('4')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">4</button>
            <button onclick="appendToDisplay('5')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">5</button>
            <button onclick="appendToDisplay('6')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">6</button>
            <button onclick="appendToDisplay('-')" class="btn-3d bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 rounded-xl">-</button>

            <button onclick="appendToDisplay('1')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">1</button>
            <button onclick="appendToDisplay('2')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">2</button>
            <button onclick="appendToDisplay('3')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">3</button>
            <button onclick="appendToDisplay('+')" class="btn-3d bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 rounded-xl">+</button>

            <button onclick="appendToDisplay('0')" class="btn-3d col-span-2 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">0</button>
            <button onclick="appendToDisplay('.')" class="btn-3d bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl">.</button>
            <button onclick="calculate()" class="btn-3d bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 rounded-xl">=</button>
        </div>
    </div>
 <script src="main.js"></script>
</body>
</html>
